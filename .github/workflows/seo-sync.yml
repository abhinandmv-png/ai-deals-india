name: Sync SEO deal directory

on:
  push:
    paths:
      - deals.json
      - scripts/generate-seo.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate crawlable deal directory and sitemap
        run: python scripts/generate-seo.py
      - name: Commit generated SEO files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deals.html sitemap.xml
          git diff --cached --quiet || git commit -m "Auto-sync SEO deal directory"
          git push
